# svc-hello's database, as the team asks for it.
#
# This is the whole developer-facing surface of a Cloud SQL Postgres instance:
# five fields, none of which names a Google Cloud resource. The Composition
# behind it creates the instance (private IP only, IAM authentication on,
# deletion protection on), the database, the IAM user for this System's Google
# service account, the break-glass admin Secret, the GRANT job that gives the
# IAM user privileges, and the main-connection ConfigMap. None of that appears
# here, which is the point of ADR-0012 §6: the schema speaks intent, not
# mechanism.
#
# What the names here decide, because the Composition derives from them:
#   namespace svc-hello + name main
#     -> instance external name  svc-hello-main
#     -> connection name         platform-factory-ref:us-central1:svc-hello-main
#     -> database                app
#     -> IAM user                svc-hello@platform-factory-ref.iam
#   Both strings appear again in deployment.yaml, in the proxy args and DB_USER.
#
# Prerequisite the claim cannot express: layer 1's Private Services Access
# range and peering must exist before this reconciles. Without them the
# instance sits in a NETWORK_NOT_PEERED error loop rather than failing loudly.
apiVersion: platform.thecloudgeek.io/v1alpha1
kind: Database
metadata:
  name: main
  namespace: svc-hello
spec:
  engine: POSTGRES_16
  region: us-central1
  # S maps to db-f1-micro. Asking for L here is one of the two denials C-07(b)
  # records: the XRD's CEL rule refuses size L unless tier is critical, and the
  # API server says so by name before Crossplane ever runs.
  size: S
  # tier defaults to standard and backups defaults to true; both are written
  # out because a reference implementation should show what it is relying on
  # rather than leave a reader to find the default in the XRD.
  tier: standard
  backups: true
