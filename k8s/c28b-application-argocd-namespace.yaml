# C-28 (b), TEMPORARY: the same Application, asking to be created in the
# `argocd` namespace, where Argo CD would actually read it. Refused by kind
# first; the project's destination rule is a second wall behind that.
# Removed by the next PR once the refusal is recorded.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-escape-argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/platform-factory/svc-hello
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
