# C-28 (b), TEMPORARY: a raw cloud object in the tenant's own k8s/. The
# tenant's Argo CD project leaves out every *.cnrm.cloud.google.com kind, so
# the sync must refuse it by kind, and Kyverno would refuse it behind that.
# Removed by the next PR once the refusal is recorded.
apiVersion: sql.cnrm.cloud.google.com/v1beta1
kind: SQLInstance
metadata:
  name: tenant-made
  namespace: svc-hello
spec:
  databaseVersion: POSTGRES_16
  region: us-central1
  settings:
    tier: db-custom-16-61440
