# Pull-request checks for svc-hello.
#
# Three jobs, in increasing order of how much can go wrong outside this repo:
#
#   yaml   — every file under k8s/ parses. Hard gate; needs nothing external.
#   go     — the service vets and builds. Hard gate; needs nothing external.
#   claim  — k8s/database.yaml is valid against the platform's XRDs.
#            BEST-EFFORT, and honest about it: the XRDs live in another repo
#            (platform-factory/platform-config), so this job needs a token that
#            can read it. Without one it says so and passes. It is advisory —
#            the real gate is the API server at admission time (ADR-0014's
#            "schema denies first"), and this job exists to move that message
#            from a failed Argo sync to a red check on the PR.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yaml:
    name: k8s manifests parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every manifest under k8s/
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml

          failed = False
          for path in sorted(pathlib.Path("k8s").rglob("*.yaml")):
              try:
                  docs = [d for d in yaml.safe_load_all(path.read_text()) if d]
              except yaml.YAMLError as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True
                  continue
              for doc in docs:
                  # A manifest with no apiVersion/kind is almost always an
                  # indentation mistake that still happens to parse.
                  if "apiVersion" not in doc or "kind" not in doc:
                      print(f"FAIL {path}: a document has no apiVersion/kind")
                      failed = True
              print(f"ok   {path} ({len(docs)} document(s))")
          sys.exit(1 if failed else 0)
          PY

      - name: The image tag must be a real tag before main deploys it
        # REPLACE_ME is the placeholder the Makefile's set-image target
        # rewrites. It is fine on a feature branch; on main it would mean Argo
        # syncs a Deployment that cannot pull.
        #
        # Both halves are needed. On a `pull_request` event github.ref is
        # refs/pull/<n>/merge, NEVER refs/heads/main, so gating on github.ref
        # alone would skip this on every PR and only fail AFTER the bad tag had
        # merged and Argo had already synced an ImagePullBackOff. github.base_ref
        # is the branch the PR targets, and it is set only on pull_request
        # events — which is what makes this an actual pre-merge gate.
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: |
          if grep -q 'svc-hello:REPLACE_ME' k8s/deployment.yaml; then
            echo "::error file=k8s/deployment.yaml::image tag is still REPLACE_ME; run 'make push && make set-image' and commit the result"
            exit 1
          fi
          grep -n 'image: us-central1-docker.pkg.dev' k8s/deployment.yaml

  go:
    name: go vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than repeating it here, so the
          # pgx floor (go 1.25.0) is stated in exactly one place.
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go build ./...

  claim:
    name: database claim against the platform XRDs (best-effort)
    runs-on: ubuntu-latest
    # Advisory. A red X here should make someone look; it should not stop a
    # change to main.go from merging because a cross-repo token expired.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: svc-hello

      - name: Check for a token that can read platform-config
        id: token
        env:
          PLATFORM_CONFIG_TOKEN: ${{ secrets.PLATFORM_CONFIG_TOKEN }}
        run: |
          if [ -n "$PLATFORM_CONFIG_TOKEN" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::secret PLATFORM_CONFIG_TOKEN is not set, so the XRDs cannot be fetched; skipping schema validation. Admission on the cluster is still the real gate."
          fi

      - name: Fetch the XRDs from platform-config
        if: steps.token.outputs.have_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: platform-factory/platform-config
          ref: main
          path: platform-config
          token: ${{ secrets.PLATFORM_CONFIG_TOKEN }}
          # Only the XRDs are needed; the vendored Helm charts in that repo are
          # tens of megabytes.
          sparse-checkout: crossplane/compositions
          sparse-checkout-cone-mode: false

      - name: Install the crossplane CLI
        if: steps.token.outputs.have_token == 'true'
        env:
          # Pinned to the 2.3 line, matching the Crossplane 2.3.5 running on
          # the cluster, so the CLI and the API server agree about what a
          # v2 XRD means. v2.3.4 is the newest 2.3 CLI release (GitHub
          # releases on crossplane/cli, read 2026-09-16) and the binary is
          # published at this URL (HTTP 200, same date).
          CLI_VERSION: v2.3.4
        run: |
          curl -fsSL -o crossplane \
            "https://releases.crossplane.io/stable/${CLI_VERSION}/bin/linux_amd64/crank"
          chmod +x crossplane
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane version --client

      - name: Validate the Database claim against the XRD
        if: steps.token.outputs.have_token == 'true'
        run: |
          # Usage is `crossplane resource validate <extensions> <resources>`
          # (CLI v2.3 command reference, read 2026-09-16): extensions are the
          # schema sources, resources are the manifests to check.
          #
          # Only database.yaml is passed, deliberately. deployment.yaml and
          # service.yaml are built-in Kubernetes kinds, whose schemas the CLI
          # would go and fetch; the XRD is the schema this repo can actually
          # get wrong, because it is the one written by the platform team
          # rather than by Kubernetes.
          #
          # --error-on-missing-schemas is NOT set: this job is advisory, and a
          # schema the CLI could not resolve is a gap in the check, not a
          # defect in the claim.
          crossplane resource validate \
            platform-config/crossplane/compositions \
            svc-hello/k8s/database.yaml
