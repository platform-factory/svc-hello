# Pull-request checks for svc-hello.
#
# Three jobs:
#
#   yaml    — every file under k8s/ parses. Needs nothing external.
#   go      — the service vets and builds. Needs nothing external.
#   claims  — claims.yaml renders against the platform's own charts, the way
#             the platform's Argo CD Application will render it (ADR-0017 §6:
#             "`helm template` against the platform's chart in the service
#             repo's PR check"). It first proves it can fail: every claim in
#             .github/checks/must-fail.yaml must be refused, for the reason it
#             names (ADR-0019 §4). It needs NO token: platform-config and
#             systems are public repositories.
#
# All three are advisory for now: no ruleset in this org requires a passing
# check yet (ADR-0018 §7), so a red X shows a mistake without blocking a
# merge. The real gate is the platform's render at Argo CD, which no merge can
# skip; this job moves its refusal from a failed sync to the pull request.
#
# This replaces a Crossplane-era `claim` job that checked k8s/database.yaml
# against the XRDs only when a PLATFORM_CONFIG_TOKEN secret was set. None ever
# was, so in all 23 of its runs it skipped and reported success (svc-hello#14;
# the M2 build log's post-close addendum of 2026-09-23).
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yaml:
    name: k8s manifests parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every manifest under k8s/
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml

          failed = False
          for path in sorted(pathlib.Path("k8s").rglob("*.yaml")):
              try:
                  docs = [d for d in yaml.safe_load_all(path.read_text()) if d]
              except yaml.YAMLError as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True
                  continue
              for doc in docs:
                  # A manifest with no apiVersion/kind is almost always an
                  # indentation mistake that still happens to parse.
                  if "apiVersion" not in doc or "kind" not in doc:
                      print(f"FAIL {path}: a document has no apiVersion/kind")
                      failed = True
              print(f"ok   {path} ({len(docs)} document(s))")
          sys.exit(1 if failed else 0)
          PY

      - name: The image tag must be a real tag before main deploys it
        # REPLACE_ME is the placeholder the Makefile's set-image target
        # rewrites. It is fine on a feature branch; on main it would mean Argo
        # syncs a Deployment that cannot pull.
        #
        # Both halves are needed. On a `pull_request` event github.ref is
        # refs/pull/<n>/merge, NEVER refs/heads/main, so gating on github.ref
        # alone would skip this on every PR and only fail AFTER the bad tag had
        # merged and Argo had already synced an ImagePullBackOff. github.base_ref
        # is the branch the PR targets, and it is set only on pull_request
        # events — which is what makes this an actual pre-merge gate.
        if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
        run: |
          if grep -q 'svc-hello:REPLACE_ME' k8s/deployment.yaml; then
            echo "::error file=k8s/deployment.yaml::image tag is still REPLACE_ME; run 'make push && make set-image' and commit the result"
            exit 1
          fi
          grep -n 'image: us-central1-docker.pkg.dev' k8s/deployment.yaml

  go:
    name: go vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than repeating it here, so the
          # pgx floor (go 1.25.0) is stated in exactly one place.
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go build ./...

  claims:
    name: claims.yaml against the platform's charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: svc-hello

      # The charts and the environment's facts. Until the M2b branch merges,
      # they live on it; the platform-config PR that merges the branch also
      # flips this ref to main (ADR-0017 §12).
      - uses: actions/checkout@v4
        with:
          repository: platform-factory/platform-config
          ref: m2b-config-connector
          path: platform-config

      # This service's tenant file and the retired list.
      - uses: actions/checkout@v4
        with:
          repository: platform-factory/systems
          ref: main
          path: systems

      - name: Install Helm 3.19.4, the version Argo CD v3.4.6 bundles
        env:
          HELM_VERSION: v3.19.4
          # From https://get.helm.sh/helm-v3.19.4-linux-amd64.tar.gz.sha256sum
          HELM_SHA256: 759c656fbd9c11e6a47784ecbeac6ad1eb16a9e76d202e51163ab78504848862
        run: |
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Render claims.yaml the way the platform will
        run: |
          python3 svc-hello/.github/scripts/check_claims.py \
            --platform-config platform-config --systems systems
